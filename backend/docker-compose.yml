version: '3.8'

services:
  backend:
    build: .
    container_name: ruangsense-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-mypassword}@mongodb:27017/${MONGO_DB:-ruangsense}?authSource=admin
    volumes:
      - ./wwebjs_auth:/app/wwebjs_auth
    shm_size: '512mb'
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: ruangsense-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mypassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ruangsense}
    volumes:
      - ./data/db:/data/db